version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crosspanel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST_OS=linux
      - TARGET_OS=auto
      - TERMINAL_ENABLED=true
      - PHPMYADMIN_PORT=888
      - DATABASE_URL=sqlite+aiosqlite:///app/data/crosspanel.db
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crosspanel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crosspanel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - HOST=0.0.0.0
      - VITE_API_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crosspanel_net

networks:
  crosspanel_net:
    driver: bridge
