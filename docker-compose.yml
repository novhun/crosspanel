version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crosspanel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST_OS=linux
      - TARGET_OS=auto
      - TERMINAL_ENABLED=true
      - PHPMYADMIN_PORT=888
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - crosspanel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crosspanel_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - crosspanel_net

networks:
  crosspanel_net:
    driver: bridge
